spring.application.name=backend
spring.profiles.default=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Autenticación JWT
app.security.jwt.issuer=${JWT_ISSUER:backend}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}

# Servidor
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Codificación
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Respuestas de error estándar (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Monitoreo: solo se exponen endpoints seguros
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:dev}
