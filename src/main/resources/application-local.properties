# Perfil local para levantar el backend sin PostgreSQL.
# Ideal para probar Swagger y endpoints desde IntelliJ.
spring.datasource.url=jdbc:h2:mem:backend_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.security.jwt.secret=${JWT_SECRET:bG9jYWwtb25seS1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzISE=}
